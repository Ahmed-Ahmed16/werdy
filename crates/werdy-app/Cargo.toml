[package]
name = "werdy-app"
version = "0.1.0"
description = "The werdy app, built with Dioxus. Web first (ADR 0029)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
werdy-core = { path = "../werdy-core", features = ["serde"] }
werdy-store = { path = "../werdy-store" }
werdy-data = { path = "../werdy-data" }
werdy-calendar = { path = "../werdy-calendar" }
werdy-reminders = { path = "../werdy-reminders" }
werdy-sync = { path = "../werdy-sync", features = ["supabase"] }
getrandom = { version = "0.2", features = ["js"] }
sha2 = "0.10"
dioxus = "0.7.10"
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
fluent-syntax = "0.12.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Performance", "Coordinates", "Document", "Element", "Event", "Geolocation", "HtmlDialogElement", "HtmlElement", "Navigator", "Position", "PositionError", "PositionOptions", "Storage", "StorageEvent", "Window"] }
wasm-bindgen = "0.2"
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
wasm-bindgen-futures = "=0.4.79"

[target.'cfg(target_os = "android")'.dependencies]
manganis = "=0.7.10"

[features]
default = ["web"]
# dx turns on the feature named after the platform it builds for.
web = ["dioxus/web"]
mobile = ["dioxus/mobile"]

[lints]
workspace = true

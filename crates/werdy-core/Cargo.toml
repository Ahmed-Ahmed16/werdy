[package]
name = "werdy-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Serde derives for the local store. Off by default so core has no dependencies.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1.0.145"

[lints]
workspace = true

name: Supabase deploy

# Only main can supply code to jobs that hold live project secrets.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  migrations:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - name: Preview and apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo '::error::Add the SUPABASE_DB_URL repository secret before deploying.'
            exit 1
          fi
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
          # CLI 2.54.11 supports --yes, so CI never waits for a prompt.
          supabase db push --db-url "$SUPABASE_DB_URL" --yes

  functions:
    needs: migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo '::notice::Owner must add the SUPABASE_ACCESS_TOKEN repository secret to deploy Edge Functions.'
            exit 0
          fi
          for entry in supabase/functions/*/index.ts; do
            [[ -f "$entry" ]] || continue
            name=$(basename "$(dirname "$entry")")
            flags=()
            # push-send checks its own bearer secret instead of a user JWT.
            if [[ "$name" == push-send ]]; then
              flags+=(--no-verify-jwt)
            fi
            supabase functions deploy "$name" \
              --project-ref ysrvszrhkwgsqrrvvdhj --use-api "${flags[@]}"
          done

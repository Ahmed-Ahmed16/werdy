name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The browser only code in werdy-app compiles for wasm alone.
      - run: cargo clippy -p werdy-app --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Install browser test runner
        run: |
          version=$(python3 -c 'import tomllib; lock = tomllib.load(open("Cargo.lock", "rb")); print(next(p["version"] for p in lock["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Run browser tests in headless Chrome
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          export CHROMEDRIVER="$(command -v chromedriver)"
          test -n "$CHROMEDRIVER"
          cargo test --locked -p werdy-app --bin werdy-app --target wasm32-unknown-unknown

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/configure-pages@v5
      - run: cargo install dioxus-cli --version 0.7.10 --locked
      - run: dx build --platform web --release --base-path werdy
        working-directory: crates/werdy-app
      - name: Prepare Pages files
        shell: pwsh
        run: ./scripts/prepare-pages.ps1 -PublicDir target/dx/werdy-app/release/web/public
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/dx/werdy-app/release/web/public
      - id: deployment
        uses: actions/deploy-pages@v4

[package]
name = "signin-dioxus"
version = "0.0.0"
edition = "2024"
publish = false
description = "Throwaway spike for issue #13: Google sign in on Android and the web with Dioxus."

# Own workspace, so the spike stays out of the werdy workspace and its lints.
[workspace]

[dependencies]
dioxus = "0.7.10"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
tokio = { version = "1", features = ["time"] }
manganis = "=0.7.10"

[features]
default = []
web = ["dioxus/web"]
mobile = ["dioxus/mobile"]

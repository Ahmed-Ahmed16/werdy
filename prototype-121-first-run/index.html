<style>
/* Layout: control band on top, a phone frame with the flow, notes beside it (stacked on a phone). */
:root{
  --bg:#F4F6F3;--page:#DFE5E0;--surface:#FFFFFF;--muted:#EDF0EC;--border:#E1E6E2;
  --text:#16201B;--tm:#56625B;--primary:#0F5C45;--onprimary:#FFFFFF;--psoft:#EAF4EE;
  --hold:#9A4A1E;--holdsoft:#FBEFE6;--bar:#16201B;--onbar:#FFFFFF;
  --font:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --fs:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111815;--page:#0B100E;--surface:#18211D;--muted:#202B26;--border:#2C3833;
  --text:#E4ECE7;--tm:#9DABA3;--primary:#6CC9A0;--onprimary:#0B100E;--psoft:#1B3A2E;
  --hold:#F0A877;--holdsoft:#33231A;--bar:#E4ECE7;--onbar:#0B100E;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111815;--page:#0B100E;--surface:#18211D;--muted:#202B26;--border:#2C3833;
  --text:#E4ECE7;--tm:#9DABA3;--primary:#6CC9A0;--onprimary:#0B100E;--psoft:#1B3A2E;
  --hold:#F0A877;--holdsoft:#33231A;--bar:#E4ECE7;--onbar:#0B100E;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--text);font-family:var(--font);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* control band (prototype only, English) */
.band{direction:ltr;font-family:system-ui,"Segoe UI",sans-serif;font-size:13px;display:flex;flex-direction:column;gap:8px;max-width:1100px;margin:0 auto 14px}
.band h1{font-size:16px;margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stamp{background:#C2413A;color:#fff;font-size:11px;padding:2px 7px;border-radius:4px;font-weight:600;letter-spacing:.04em}
.ctrls{display:flex;flex-wrap:wrap;gap:6px 14px}
.ctrl{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0;max-width:100%}
.ctrl > span{color:var(--tm)}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.band,.stage{min-width:0}
.band h1{min-width:0}
.seg button{border:0;background:transparent;padding:4px 9px;font-size:12px}
.seg button.on{background:var(--primary);color:var(--onprimary)}

.stage{display:flex;gap:24px;justify-content:center;align-items:flex-start;flex-wrap:wrap;max-width:1100px;margin:0 auto}
.phone{width:380px;max-width:100%;height:740px;border:9px solid #1d2420;border-radius:32px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;font-size:var(--fs)}
.notes{direction:ltr;font-family:system-ui,"Segoe UI",sans-serif;font-size:13px;width:340px;max-width:100%;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.notes h2{font-size:14px;margin:0 0 6px}
.notes ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.notes .now{background:var(--psoft);border-radius:6px;padding:6px 8px;margin:0 0 10px}
.notes code{font-size:12px}
@media (max-width:520px){
  .phone{width:100%;height:auto;min-height:640px;border:0;border-radius:12px;box-shadow:0 0 0 1px var(--border)}
  .stage{gap:16px}
}

/* in-phone UI (real copy, Arabic first) */
.scr{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px;gap:8px}
.brand{font-weight:700;color:var(--primary);font-size:1.0625rem;letter-spacing:.01em}
.steps{display:flex;gap:5px}
.steps i{width:7px;height:7px;border-radius:50%;background:var(--border);display:block}
.steps i.on{background:var(--primary);width:18px;border-radius:4px}
.head{padding:6px 16px 10px}
.head h2{font-size:1.375rem;margin:0 0 4px;text-wrap:balance;line-height:1.35}
.head p{margin:0;color:var(--tm);font-size:.9375rem;line-height:1.6}
.body{padding:0 16px 12px;display:flex;flex-direction:column;gap:10px;flex:1}
.foot{padding:10px 16px 14px;border-top:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:6px;align-items:stretch}
.primary{background:var(--primary);color:var(--onprimary);border:0;border-radius:12px;padding:.8rem 1rem;font-weight:600;font-size:1rem;min-height:48px}
.primary:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--primary);padding:.45rem;font-size:.9375rem;font-weight:500;min-height:40px}
.link.small{font-size:.875rem;color:var(--tm);text-decoration:underline;text-underline-offset:3px}
.credit{font-size:.8125rem;color:var(--tm);line-height:1.55;margin:2px 2px 0}
.count{font-variant-numeric:tabular-nums;color:var(--tm);font-size:.875rem;white-space:nowrap}

/* A: cards */
.lvl{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.lvl.sel{border-color:var(--primary);background:var(--psoft)}
.lvl-row{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:start;width:100%}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--tm);flex:none;display:grid;place-items:center}
.sel .radio{border-color:var(--primary)}
.sel .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.lvl-name{font-weight:600;font-size:1.0625rem;flex:1;min-width:0}
.lvl p{margin:0;font-size:.875rem;line-height:1.6;color:var(--tm)}
.more{align-self:flex-start;background:none;border:0;color:var(--primary);font-size:.875rem;padding:4px 0}
.deedlist{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--border);padding-top:8px}
.slot h4{margin:0 0 2px;font-size:.8125rem;color:var(--primary);font-weight:600}
.slot ul{margin:0;padding-inline-start:18px;font-size:.875rem;line-height:1.6}

/* B: day preview */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--muted);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:.5rem .25rem;font-size:.875rem;line-height:1.3;min-height:44px}
.tabs button.on{background:var(--surface);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.daybox{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px 12px}
.dayslot{border-bottom:1px solid var(--border);padding:8px 0}
.dayslot:last-child{border-bottom:0}
.dayslot summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;font-weight:600;font-size:.9375rem;min-height:32px}
.dayslot summary::-webkit-details-marker{display:none}
.dayslot ul{margin:4px 0 0;padding-inline-start:18px;font-size:.875rem;line-height:1.6;color:var(--tm)}
.sum{font-size:.875rem;color:var(--tm);line-height:1.6;margin:0}

/* C: compare */
.cmpwrap{overflow-x:auto}
table.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:.875rem;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:.55rem .35rem;text-align:center;border-bottom:1px solid var(--border)}
.cmp th:first-child,.cmp td:first-child{text-align:start;color:var(--tm);font-weight:500}
.cmp thead button{border:1.5px solid var(--border);background:var(--surface);border-radius:10px;padding:.4rem .3rem;width:100%;font-weight:600;font-size:.8125rem;line-height:1.3;min-height:44px}
.cmp .on{background:var(--psoft)}
.cmp thead .on button{border-color:var(--primary);color:var(--primary)}
.cmp tr.total td{font-weight:700;border-bottom:0}

/* extras */
.extra{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;text-align:start;width:100%}
.extra.on{border-color:var(--primary);background:var(--psoft)}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--tm);flex:none;display:grid;place-items:center;margin-top:2px;font-size:14px;line-height:1;color:var(--onprimary)}
.extra.on .box{background:var(--primary);border-color:var(--primary)}
.extra .t{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.extra .why{font-size:.8125rem;color:var(--primary);margin-top:2px}
.extra .d{font-size:.8125rem;color:var(--tm);line-height:1.6;margin-top:2px}
.extra > div{flex:1;min-width:0}
.warn{font-size:.8125rem;color:var(--hold);background:var(--holdsoft);border-radius:10px;padding:8px 10px;line-height:1.55;margin:0}

/* own deeds */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.875rem;font-weight:600}
.input{border:1.5px solid var(--border);background:var(--surface);border-radius:10px;padding:.65rem .75rem;min-height:46px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:.3rem .75rem;font-size:.8125rem;min-height:36px}
.chip.on{background:var(--primary);color:var(--onprimary);border-color:var(--primary)}
.addbtn{border:1.5px solid var(--primary);color:var(--primary);background:transparent;border-radius:10px;padding:.55rem;font-weight:600;min-height:44px}
.ownlist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ownlist li{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.4rem .4rem .4rem .75rem;gap:8px}
.ownlist li span{min-width:0}
.ownlist li small{color:var(--tm);margin-inline-start:6px}
.x{border:0;background:var(--muted);border-radius:8px;min-width:36px;min-height:36px}

/* location (today's step, kept) */
.today{font-size:.75rem;color:var(--tm);border:1px dashed var(--border);border-radius:8px;padding:6px 8px;direction:ltr;font-family:system-ui,sans-serif;margin:0}
.ghostbtn{border:1.5px solid var(--border);background:var(--surface);border-radius:10px;padding:.6rem;min-height:44px}

/* watcher placeholder */
.hold{border:2px dashed var(--hold);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--holdsoft)}
.holdtag{direction:ltr;font-family:system-ui,sans-serif;font-size:11px;font-weight:700;color:var(--hold);letter-spacing:.05em}
.hold h3{margin:0;font-size:1.125rem}
.hold p{margin:0;font-size:.875rem;color:var(--tm);line-height:1.6}
.hold .row{display:flex;gap:8px;flex-wrap:wrap}
.hold .row > *{flex:1;min-width:120px}

/* done */
.recap{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px 14px}
.recap div{display:flex;justify-content:space-between;gap:10px;padding:.6rem 0;border-bottom:1px solid var(--border);font-size:.9375rem}
.recap div:last-child{border-bottom:0;font-weight:700}

/* floating switcher (prototype only) */
.switch{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--bar);color:var(--onbar);border-radius:999px;display:flex;align-items:center;gap:4px;padding:5px;box-shadow:0 6px 20px rgba(0,0,0,.25);direction:ltr;font-family:system-ui,sans-serif;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.switch button{background:transparent;border:0;color:inherit;width:36px;height:36px;border-radius:50%;font-size:16px}
.switch button:hover{background:rgba(127,127,127,.25)}
.switch span{padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  const total=rows.reduce((a,r)=>a+r[1],0);
  return shell(L.doneHead,L.doneHelp,`<div class="recap">${rows.map(r=>`<div><span>${esc(r[0])}</span><span class="count">${num(r[1])}</span></div>`).join("")}<div><span>${L.total}</span><span>${num(total)}</span></div></div>`,
    `<button class="primary" data-act="restart">${L.open}</button><button class="link small" data-act="restart">${L.restart}</button>`);
}

/* ---------- render ---------- */
function seg(label,key,opts){
  return `<div class="ctrl"><span>${label}</span><div class="seg">${opts.map(([v,l])=>`<button data-ctl="${key}" data-v="${v}" class="${String(st[key])===String(v)?"on":""}">${l}</button>`).join("")}</div></div>`;
}
function render(){
  if(st.step>=steps().length)st.step=steps().length-1;
  const phone=document.getElementById("phone");
  phone.setAttribute("dir",st.lang==="ar"?"rtl":"ltr");phone.setAttribute("lang",st.lang);
  phone.style.setProperty("--fs",st.fs+"px");
  const s=steps()[st.step];
  const html={level:stepLevel,extras:stepExtras,own:stepOwn,location:stepLocation,watcher:stepWatcher,done:stepDone}[s]();
  const scr=document.getElementById("scr");scr.innerHTML=html;
  document.getElementById("ctrls").innerHTML=
    seg("Language","lang",[["ar","العربية"],["en","English"]])+
    seg("Text","fs",[[14,"S"],[16,"M"],[19,"L"],[22,"XL"]])+
    seg("Level screen","variant",VARIANTS.map(v=>[v[0],v[1]+" "+v[2]]))+
    seg("Card titles","naming",[["academy","Academy level 1/2/3"],["sheet","Sheet names (#113)"]])+
    seg("What the level lacks","rule",[["meaning","By meaning (3 sets)"],["keys","No shared deed (12 sets)"]])+
    seg("Five prayers ticked","pretick",[["on","Yes"],["off","No"]])+
    seg("Location step","order",[["after","After deeds"],["first","First, as today"]])+
    seg("Watcher step for","role",[["owner","An owner"],["watcher","Someone asked to watch"]])+
    seg("Theme","theme",[["auto","Auto"],["light","Light"],["dark","Dark"]])+
    `<div class="ctrl"><span>Jump</span><div class="seg">${steps().map((x,i)=>`<button data-ctl="step" data-v="${i}" class="${i===st.step?"on":""}">${x}</button>`).join("")}</div></div>`;
  const v=VARIANTS.find(x=>x[0]===st.variant);
  document.getElementById("vlabel").textContent=`Level screen ${v[1]} (${v[2]})`;
  document.getElementById("notes").innerHTML=`<h2>Questions for you</h2>
    <p class="now">Now showing: <b>${s}</b> step, level screen <b>${v[1]} ${v[2]}</b>.</p>
    <ol>
      <li><b>Level screen:</b> A cards (recommended), B day preview, or C compare?</li>
      <li><b>What a level lacks:</b> a short list written by hand per level (recommended: five prayers on time, fasting and seasons, Ramadan, with five prayers ticked), or every old set (12, with near duplicates)?</li>
      <li><b>Location:</b> after the deeds (recommended) or first, as today?</li>
    </ol>
    <h2 style="margin-top:10px">Already decided</h2>
    <ol>
      <li>Titles "Academy level 1, 2, 3"; the instructors' credit under the cards.</li>
      <li>"Start empty" skips the level and the extra sets and goes to "Add your own deeds".</li>
      <li>The watcher step is a placeholder until #120.</li>
    </ol>`;
  document.documentElement.toggleAttribute("data-theme",st.theme!=="auto");
  if(st.theme!=="auto")document.documentElement.setAttribute("data-theme",st.theme);
}
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-ctl]");
  if(c){const k=c.dataset.ctl,v=c.dataset.v;
    if(k==="step")st.step=+v;
    else if(k==="fs")st.fs=+v;
    else{st[k]=v;
      if(k==="variant"){history.replaceState(null,"","#"+v);go("level");return;}
      if(k==="pretick"||k==="rule")applyPretick();
    }
    render();return;}
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act,i=+a.dataset.i;
  if(act==="level"){st.level=i;st.tab=i;}
  else if(act==="open"){st.open=st.open===i?null:i;}
  else if(act==="tab"){st.tab=i;st.level=i;}
  else if(act==="lvlnext"){if(st.variant==="day")st.level=st.tab;st.empty=false;applyPretick();nextStep();return;}
  else if(act==="empty"){st.empty=true;st.level=null;st.extras.clear();go("own");return;}
  else if(act==="extra"){const k=a.dataset.k;st.extras.has(k)?st.extras.delete(k):st.extras.add(k);}
  else if(act==="next"){nextStep();return;}
  else if(act==="ownslot"){st.ownSlot=a.dataset.k;}
  else if(act==="add"){const inp=document.getElementById("ownname");const v=inp.value.trim();if(v)st.own.push([v,st.ownSlot]);}
  else if(act==="del"){st.own.splice(i,1);}
  else if(act==="restart"){Object.assign(st,{step:0,level:null,extras:new Set(),own:[],empty:false,open:null,tab:0});}
  render();
});
function applyPretick(){st.extras.delete("five_prayers");if(st.pretick==="on")st.extras.add("five_prayers");}
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select,[contenteditable]"))return;
  if(e.key==="Enter"&&e.target.id==="ownname")return;
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;
  cycle(e.key==="ArrowRight"?1:-1);
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ownname"){e.preventDefault();document.querySelector('[data-act="add"]').click();}});
function cycle(d){const i=VARIANTS.findIndex(v=>v[0]===st.variant);st.variant=VARIANTS[(i+d+VARIANTS.length)%VARIANTS.length][0];history.replaceState(null,"","#"+st.variant);go("level");}
document.getElementById("prev").onclick=()=>cycle(-1);
document.getElementById("next").onclick=()=>cycle(1);
window.addEventListener("hashchange",()=>{fromHash();go("level");});
applyPretick();render();
})();
</script>

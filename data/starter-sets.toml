# werdy starter sets (ADR 0019, ADR 0024).
#
# Sets 1 to 12 are our own writing from common practice and the owner's own
# sheet. The three level sets come from the Academy instructors' level
# sheets, used with their permission and credited (issue #106 has the
# transcription). Werd's wording, order, sections and points are never
# copied. Every deed weighs the same (ADR 0008), so there are no points here,
# not even the level sheets' points.
#
# How to edit:
# * Each deed is written once under [[deeds]]. A set lists deed keys.
#   Two sets that share a deed list the same key, so the deed is added once.
# * "name" is a Fluent key. Add it to locales/ar/starter-sets.ftl and
#   locales/en/starter-sets.ftl, or the tests fail.
# * An Academy set has a level block with a unique order, title and summary.
#   Its offers list names extra sets in display order. An offer has a why key
#   and may start ticked. Add each text key to both starter sets locale files.
#   Offer sets must exist, must not be levels and may appear once per level.
# * A schedule is "every_day", { weekdays = ["friday"] } or
#   { hijri = "ramadan" }. Hijri range keys must be in hijri_ranges.
# * A target is optional: { amount = 20, unit = "pages" }.

# Time slots in sheet order (ADR 0007).
slots = ["fajr", "morning", "dhuhr", "asr", "maghrib", "isha", "night", "any_time"]

# The fixed v1 categories (ADR 0007).
categories = [
    "prayer",
    "quran",
    "adhkar",
    "fasting",
    "charity",
    "study",
    "family",
    "health",
    "work",
    "other",
]

# Hijri ranges by key (ADR 0009). The days each key covers:
# ramadan: the whole of Ramadan.
# last_ten_nights: the last ten nights of Ramadan.
# dhul_hijjah_first_ten: 1 to 10 Dhul Hijjah.
# dhul_hijjah_first_nine: 1 to 9 Dhul Hijjah (no fasting on Eid).
# dhul_hijjah_takbir: 1 Dhul Hijjah to the end of the takbir days. End day ___ (to confirm, the draft says 13).
# arafah: 9 Dhul Hijjah.
# tasua_and_ashura: 9 and 10 Muharram.
# ashura: 10 Muharram.
# ayyam_al_bid: 13 to 15 of every Hijri month.
hijri_ranges = [
    "ramadan",
    "last_ten_nights",
    "dhul_hijjah_first_ten",
    "dhul_hijjah_first_nine",
    "dhul_hijjah_takbir",
    "arafah",
    "tasua_and_ashura",
    "ashura",
    "ayyam_al_bid",
]


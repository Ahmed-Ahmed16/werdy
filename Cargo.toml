[workspace]
members = ["crates/werdy-core", "crates/werdy-data", "crates/werdy-store", "crates/werdy-app"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
authors = ["Ahmed Hossam"]
repository = "https://github.com/Ahmed-Ahmed16/werdy"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
